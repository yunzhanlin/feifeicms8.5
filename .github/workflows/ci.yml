name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-matrix:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, json, mbstring, openssl, pdo_mysql
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find app config route tests scripts public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit --fail-on-phpunit-deprecation

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - run: composer audit --locked --no-interaction

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: feifeicms_test
          MYSQL_USER: feifeicms
          MYSQL_PASSWORD: feifeicms-test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, fileinfo, json, mbstring, openssl, pdo_mysql, redis
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Configure test runtime
        run: |
          cp .example.env .env
          sed -i 's/^DB_HOST.*/DB_HOST = 127.0.0.1/' .env
          sed -i 's/^DB_NAME.*/DB_NAME = feifeicms_test/' .env
          sed -i 's/^DB_USER.*/DB_USER = feifeicms/' .env
          sed -i 's/^DB_PASS.*/DB_PASS = feifeicms-test-password/' .env
          sed -i 's/^CACHE_DRIVER.*/CACHE_DRIVER = redis/' .env
          sed -i 's/^REDIS_HOST.*/REDIS_HOST = 127.0.0.1/' .env
          sed -i 's/^SEARCH_DRIVER.*/SEARCH_DRIVER = mysql/' .env
          mkdir -p runtime public/uploads
      - name: Load MySQL 8 schema
        run: mysql --protocol=TCP -h127.0.0.1 -ufeifeicms -pfeifeicms-test-password feifeicms_test < database/schema.sql
      - run: php think feifei:doctor
      - run: vendor/bin/phpunit --fail-on-phpunit-deprecation
