services:
  statistics:
    build: .
    image: feifeicms-usage:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STATS_PORT:-18185}:80"
    environment:
      STATS_PUBLIC_URL: "${STATS_PUBLIC_URL:-https://tj.shankan.cc}"
      STATS_TRUST_PROXY: "1"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') === '{\"ok\":true}' ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
