# 将 /var/www/html 替换为实际程序目录；网站运行目录只能是 public/。
# 本示例使用全局已启用的 PHP 处理器；PHP-FPM 请在此站点单独配置。
# 伪静态放在 VirtualHost，才能关闭软链接而不破坏 mod_rewrite。
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        AllowOverride None
        Options -Indexes -MultiViews -FollowSymLinks -SymLinksIfOwnerMatch
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/(?:(?:public|index\.php|admin\.php|api\.php|install\.php)/)*(?:view|tpl|template|templates|app|config|database|deploy|docker|docs|extend|plugins|route|runtime|scripts|tests|vendor|qa)(?:[/.]|$) - [F,END,NC]
    RewriteRule ^/(?:composer\.(?:json|lock|phar)|phpunit\.xml|think|Dockerfile|docker-compose\.ya?ml)(?:/|$) - [F,END,NC]
    RewriteRule ^/legacy/(?:Lib|Tpl|Runtime|Uploads)(?:[/.]|$) - [F,END,NC]
    RewriteRule ^/(?:uploads|storage|static|mxstatic|player|legacy)/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)(?:/|$) - [F,END,NC]
    RewriteRule (^|/)\.(?!well-known(?:/|$)) - [F,END]
    RewriteRule ^/(?:admin|api)\.php(?:/(.*))?$ /index.php/$1 [QSA,PT,L]
    RewriteRule ^/(?!index\.php(?:/|$)|install\.php$).*\.(?:php[0-9]?|phtml|phar)(?:/|$) - [F,END,NC]
    RewriteCond %{DOCUMENT_ROOT}/$1 !-d
    RewriteCond %{DOCUMENT_ROOT}/$1 !-f
    RewriteRule ^/(.*)$ /index.php/$1 [QSA,PT,L]
</VirtualHost>
