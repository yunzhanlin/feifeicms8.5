# 在宝塔站点的“伪静态”中引用本文件内容。
# 站点运行目录必须设为 public/，PHP 处理器仍由宝塔站点配置生成。

location / {
    if (!-e $request_filename) {
        rewrite ^/(.*)$ /index.php?s=/$1 last;
    }
}

# 上传目录绝不执行脚本。
location ~* ^/uploads/.*\.(?:php|phtml|phar|cgi|pl|py|sh)$ {
    return 403;
}

# 前后台静态资源由文件版本号或 ETag 刷新，避免每次请求都回源 PHP。
location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?|ttf|eot)$ {
    expires 7d;
    try_files $uri =404;
}

# 禁止访问隐藏文件，ACME 验证目录除外。
location ~ /\.(?!well-known/) {
    deny all;
}
