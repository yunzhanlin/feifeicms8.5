# 在宝塔站点的“伪静态”中引用本文件内容。
# 站点运行目录必须设为 public/，PHP 处理器仍由宝塔站点配置生成。
# 下列 server 级规则必须放在 PHP 和静态资源 location 之外。
# 即使已有 PHP/CSS location 排在前面，也不能绕过这些规则。
autoindex off;
disable_symlinks on;

if ($uri ~* "^/(?:(?:public|index\.php|admin\.php|api\.php|install\.php)/)*(?:view|tpl|template|templates|app|config|database|deploy|docker|docs|extend|plugins|route|runtime|scripts|tests|vendor|qa)(?:[/.]|$)") { return 404; }
if ($uri ~* "^/(?:composer\.(?:json|lock|phar)|phpunit\.xml|think|Dockerfile|docker-compose\.ya?ml)(?:/|$)") { return 404; }
if ($uri ~* "^/legacy/(?:Lib|Tpl|Runtime|Uploads)(?:[/.]|$)") { return 404; }
if ($uri ~* "^/(?:uploads|storage|static|mxstatic|player|legacy)/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)(?:/|$)") { return 404; }

location / {
    if (!-e $request_filename) {
        rewrite ^/(.*)$ /index.php?s=/$1 last;
    }
}

# 上传目录绝不执行脚本。
location ~* ^/uploads/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)(?:/|$) {
    return 403;
}

# 前后台静态资源由文件版本号或 ETag 刷新，避免每次请求都回源 PHP。
location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?|ttf|eot)$ {
    expires 7d;
    try_files $uri =404;
}

# 禁止访问隐藏文件，ACME 验证目录除外。
location ~ /\.(?!well-known/) {
    deny all;
}
