<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{$siteName|htmlspecialchars|raw}">
    <title>{$pageTitle|htmlspecialchars|raw}</title>
    <link rel="stylesheet" href="/static/app.css?v=2">
    <link rel="stylesheet" href="/static/content.css?v=2">
    <link rel="stylesheet" href="/static/frontend-v2.css?v=2">
</head>
<body>
<header class="site-header">
    <div class="shell header-inner">
        <a class="brand" href="/">{$siteName|htmlspecialchars|raw}</a>
        <nav class="site-nav" aria-label="主导航"><a href="/">首页</a>{volist name="navCategories" id="nav"}<a href="/list/{$nav.id}">{$nav.name|htmlspecialchars|raw}</a>{/volist}</nav>
        <form class="search-form" action="/search" method="get" role="search">
            <label class="sr-only" for="site-search">搜索影片</label>
            <input id="site-search" name="wd" type="search" value="{$keyword|default=''|htmlspecialchars|raw}" placeholder="片名、演员或导演" maxlength="80">
            <button type="submit">搜索</button>
        </form>
    </div>
</header>
<main class="shell main-content">
