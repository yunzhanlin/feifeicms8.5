<div class="mx-login-modal" data-login-modal hidden>
    <div class="mx-login-mask" data-login-close></div>
    <div class="mx-login-box">
        <button class="mx-login-close" type="button" data-login-close>×</button>
        <h3>登录后参与评论</h3>
        <p>当前后台设置为登录后才能发表评论。</p>
        <div class="mx-login-actions">
            {notempty name="fullComments"}
            <a class="mx-btn" href="/user/login?redirect={:urlencode(ff_url('comments',$vod.vod_id) . '#comments')}">立即登录</a>
            <a class="mx-btn mx-btn-light" href="/user/register?redirect={:urlencode(ff_url('comments',$vod.vod_id) . '#comments')}">注册账号</a>
            {else /}
            <a class="mx-btn" href="/user/login?redirect={:urlencode(ff_url('vod',$vod.vod_id) . '#comments')}">立即登录</a>
            <a class="mx-btn mx-btn-light" href="/user/register?redirect={:urlencode(ff_url('vod',$vod.vod_id) . '#comments')}">注册账号</a>
            {/notempty}
        </div>
    </div>
</div>
