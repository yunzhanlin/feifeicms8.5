{include file="admin/layout/header" /}
<div class="section-heading"><div><p class="eyebrow">Category Editor</p><h1>{if $isNew}新增分类{else /}编辑分类 #{$item.id}{/if}</h1></div><a class="button secondary" href="/admin/categories">返回列表</a></div>
<form class="editor-form" method="post" action="{if $isNew}/admin/categories{else /}/admin/categories/{$item.id}{/if}"><input type="hidden" name="_token" value="{$csrf|htmlspecialchars|raw}">
<section class="editor-section"><div class="form-grid"><label>分类名称<input name="name" value="{$item.name|htmlspecialchars|raw}" maxlength="100" required></label><label>Slug<input name="slug" value="{$item.slug|htmlspecialchars|raw}" maxlength="120" {if !$isNew}readonly{/if}></label></div><div class="form-grid cols-4"><label>上级分类<select name="parent_id"><option value="0">顶级分类</option>{volist name="parents" id="parent"}{if $parent.id != $item.id}<option value="{$parent.id}" {if $parent.id == $item.parent_id}selected{/if}>{$parent.name|htmlspecialchars|raw}</option>{/if}{/volist}</select></label><label>内容类型<select name="content_type">{volist name="types" id="type"}<option value="{$type|htmlspecialchars|raw}" {if $type == $item.content_type}selected{/if}>{$type|htmlspecialchars|raw}</option>{/volist}</select></label><label>排序<input name="sort_order" type="number" value="{$item.sort_order}"></label><label>状态<select name="status"><option value="published" {if $item.status == 'published'}selected{/if}>发布</option><option value="draft" {if $item.status == 'draft'}selected{/if}>草稿</option></select></label></div><label>分类说明<textarea name="description" rows="3">{$item.description|htmlspecialchars|raw}</textarea></label><div class="form-grid"><label>SEO 标题<input name="seo_title" value="{$item.seo_title|default=''|htmlspecialchars|raw}"></label><label>SEO 关键词<input name="seo_keywords" value="{$item.seo_keywords|default=''|htmlspecialchars|raw}"></label></div><label>前台筛选项 JSON <small>例：{"area":["大陆","香港"],"year":["2026","2025"]}</small><textarea name="filter_options" rows="7">{$item.filter_options|default=''|htmlspecialchars|raw}</textarea></label><div><button type="submit">保存分类</button></div></section></form>
{if !$isNew}<form class="editor-form editor-section danger-zone" method="post" action="/admin/categories/{$item.id}/delete" data-confirm="确定归档这个分类？"><input type="hidden" name="_token" value="{$csrf|htmlspecialchars|raw}"><h2>归档分类</h2><p class="muted">存在子分类或关联内容时会拒绝归档。</p><div><button class="button danger" type="submit">归档</button></div></form>{/if}
{include file="admin/layout/footer" /}
