{include file="admin/layout/header" /}
<div class="title"><div class="tabs"><a class="active" href="/admin/tools/replace">数据替换</a></div></div>
{if condition="$message neq ''"}<div class="notice">{$message|htmlspecialchars|raw}</div>{/if}
<form class="legacy-settings-form" method="post" action="/admin/tools/replace"><input type="hidden" name="_token" value="{$csrf|htmlspecialchars|raw}">
<section class="section-block"><div class="section-heading"><h2>批量替换内容</h2><small>只允许替换业务内容白名单字段；每次最多处理 5000 条并写入审计日志</small></div>
<div class="legacy-form-row"><label>内容类型：</label><div><select name="scope"><option value="media">视频</option><option value="article">文章</option><option value="person">人物/角色</option><option value="topic">专题</option></select></div></div>
<div class="legacy-form-row"><label>替换字段：</label><div><select name="field"><option value="title">标题/名称</option><option value="subtitle">视频副标题</option><option value="original_title">视频原片名</option><option value="summary">简介</option><option value="content">正文</option><option value="area">发行地区</option><option value="language">语言</option><option value="author">文章作者</option><option value="source_url">文章来源</option><option value="aliases">人物别名</option><option value="biography">人物介绍</option><option value="nationality">人物国籍</option><option value="profession">人物职业</option></select><p class="muted">字段必须属于所选内容类型，否则程序会拒绝执行。</p></div></div>
<div class="legacy-form-row"><label>查找内容：</label><div><textarea name="search" rows="4" required maxlength="500"></textarea></div></div>
<div class="legacy-form-row"><label>替换为：</label><div><textarea name="replacement" rows="4" maxlength="5000"></textarea></div></div>
<div class="form-actions"><button type="submit" name="preview" value="1">预览匹配数量</button><button type="submit" name="preview" value="0" data-confirm="确定按当前条件批量替换？建议先完成数据库备份。">执行替换</button></div></section></form>
{include file="admin/layout/footer" /}
