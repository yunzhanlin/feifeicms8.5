{include file="admin/layout/header" /}
<div class="title"><div class="tabs"><a class="active" href="/admin/tools/uploads">附件管理</a></div></div>
<form class="editor-section inline-form" method="post" action="/admin/tools/uploads" enctype="multipart/form-data"><input type="hidden" name="_token" value="{$csrf|htmlspecialchars|raw}"><label>上传图片<input type="file" name="file" accept="image/jpeg,image/png,image/webp,image/gif" required></label><button type="submit">上传</button></form>
<form class="editor-section inline-form" method="post" action="/admin/tools/uploads/fetch"><input type="hidden" name="_token" value="{$csrf|htmlspecialchars|raw}"><label>下载远程图片<input type="url" name="url" placeholder="https://example.com/poster.jpg" required></label><button type="submit">下载到本地</button></form>
<div class="table-wrap"><table class="data-table"><thead><tr><th>预览</th><th>文件</th><th>大小</th><th>时间</th><th width="150">操作</th></tr></thead><tbody>{volist name="files" id="file"}<tr><td><img class="upload-thumb" src="{$file.url|htmlspecialchars|raw}" alt=""></td><td><a href="{$file.url|htmlspecialchars|raw}" target="_blank">{$file.name|htmlspecialchars|raw}</a></td><td>{$file.size} bytes</td><td>{$file.time|date='Y-m-d H:i'}</td><td><form class="inline-form" method="post" action="/admin/tools/uploads/{$file.name|urlencode}/thumbnail"><input type="hidden" name="_token" value="{$csrf|htmlspecialchars|raw}"><button class="link-button" type="submit">生成缩略图</button></form> <form class="inline-form" method="post" action="/admin/tools/uploads/{$file.name|urlencode}/delete" data-confirm="确定删除该附件？"><input type="hidden" name="_token" value="{$csrf|htmlspecialchars|raw}"><button class="link-button text-danger" type="submit">删除</button></form></td></tr>{/volist}</tbody></table></div>
{include file="admin/layout/footer" /}
