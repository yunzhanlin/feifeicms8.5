server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;
    autoindex off;
    disable_symlinks on;

    if ($uri ~* "^/(?:(?:public|index\.php|admin\.php|api\.php|install\.php)/)*(?:view|tpl|template|templates|app|config|database|deploy|docker|docs|extend|plugins|route|runtime|scripts|tests|vendor|qa)(?:[/.]|$)") { return 404; }
    if ($uri ~* "^/(?:composer\.(?:json|lock|phar)|phpunit\.xml|think|Dockerfile|docker-compose\.ya?ml)(?:/|$)") { return 404; }
    if ($uri ~* "^/legacy/(?:Lib|Tpl|Runtime|Uploads)(?:[/.]|$)") { return 404; }
    if ($uri ~* "^/(?:uploads|storage|static|mxstatic|player|legacy)/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)(?:/|$)") { return 404; }

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ @thinkphp;
    }

    location @thinkphp {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
    }

    location ~ ^/(api|admin)\.php(?:/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
    }

    location = /install.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/install.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* ^/uploads/.*\.(?:php|phtml|phar|cgi|pl|py|sh)$ {
        return 403;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
